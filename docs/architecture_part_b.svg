<svg xmlns="http://www.w3.org/2000/svg" width="680" height="710" viewBox="0 0 680 710" role="img"><title>Part B: reasoning layer</title><desc>The /ask endpoint routes a question with deterministic rules, optionally calls the detector, associates headgear with people, applies a deterministic guardrail, and only then composes an answer. Two side exits return explicit refusals without guessing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="710" fill="#FFFFFF"/><rect x="380" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="500.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">POST /ask</text><text x="500.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">question + optional image</text><line x1="500" y1="96" x2="500" y2="126" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="130" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="500.0" y="148" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">route()</text><text x="500.0" y="168" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">rule-based intent classifier</text><line x1="378" y1="158" x2="304" y2="158" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="130" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="180.0" y="148" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Detector not called</text><text x="180.0" y="168" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">off-image or out-of-scope</text><line x1="500" y1="186" x2="500" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="220" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="500.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">detector.predict()</text><text x="500.0" y="258" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">RT-DETR boxes and scores</text><line x1="500" y1="276" x2="500" y2="306" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="310" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="500.0" y="328" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">build_scene()</text><text x="500.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">helmet-to-person matching</text><line x1="500" y1="366" x2="500" y2="396" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="400" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="500.0" y="418" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">guardrail()</text><text x="500.0" y="438" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">deterministic sufficiency check</text><line x1="378" y1="428" x2="304" y2="428" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="400" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="180.0" y="418" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Insufficient information</text><text x="180.0" y="438" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">explicit refusal with reasons</text><line x1="500" y1="456" x2="500" y2="486" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="490" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="500.0" y="508" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">compose()</text><text x="500.0" y="528" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">LLM if key set, else template</text><line x1="500" y1="546" x2="500" y2="576" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="580" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="500.0" y="598" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">JSON answer + evidence</text><text x="500.0" y="618" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">routing, reasons, source</text><rect x="60" y="670" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="82" y="677" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">deterministic rule, no model</text><rect x="308" y="670" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="330" y="677" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">model call</text><rect x="430" y="670" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="452" y="677" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">request / response</text></svg>